id: email-triage-apply
name: Email Triage (acting — applies wf/* labels)
description: |
  The acting variant of email triage (docs/EMAIL_TRIAGE_ACT_PLAN.md): same
  classifier and rubric as email-triage-live, plus a minimal second agent
  step that applies the verdict back to the mailbox as a wf/<category>
  Gmail label. Privilege-split: the classifier that reads mail content has
  NO tools; the acting step holds exactly one tool and sees only the
  validated category + message id (never the mail text).

  CUTOVER DONE 2026-07-18 (docs/EMAIL_TRIAGE_ACT_PLAN.md §8 supervised
  window): this workflow now holds the email trigger; the read-only
  sibling is the manual-triggered rollback artifact. Invariant (test-
  pinned): the two siblings must never BOTH have email triggers — that
  would double-poll the mailbox.

trigger:
  type: email
  config:
    provider: gmail
    account: qspencer@gmail.com
    poll_interval_seconds: 120
    # Full-coverage scope (2026-07-26, operator request): judge ALL incoming
    # mail, not just INBOX — sender-based filters route most mail past the
    # inbox, and that mail still deserves a verdict. `label: null` drops the INBOX
    # restriction; the query excludes the user's own outgoing mail and
    # drafts (spam/trash are excluded by the Gmail API by default).
    label: null
    query: "-in:sent -in:draft -in:chat"
    # Bulk senders stamp mail BEFORE Gmail receives it (measured 2026-10-04:
    # The Information, L.L.Bean, Amazon, Airbnb, Wayfair — 1.5 to 23 min
    # early). When anything else arrives in that gap the cursor passes the
    # stamp and the message is never listed: 16 of 605 (2.6%) in five days.
    # Re-list two hours behind the cursor (5x the worst lag seen); ~10
    # messages per poll, far inside the 500-id seen ring that absorbs them.
    lookback_hours: 2

    # TWO_AXIS §3: annotate reply_status (replied/not_replied/unknown) via a
    # metadata-only thread check, so awaiting-reply is suppressed on
    # already-answered (backfilled) mail — the baseball-email fix.
    annotate_reply_status: true
    # Gmail's Authentication-Results verdict (`auth_pass`). Added for the
    # codified-sender route (CODIFY_PLAN §6), which was RETIRED 2026-09-28;
    # kept because the classifier has read it on every run since, and
    # removing an input is a classifier behaviour change of its own — one
    # to make deliberately, with the A/B harness, not inside a removal.
    annotate_auth_result: true
    # Long-body newsletters (full-coverage scope) don't need 30k tokens to
    # classify — the head suffices.
    body_max_chars: 8000
    # Drop body_html + raw headers from the payload (same rationale as the
    # read-only sibling): body_text is what triage needs.
    slim_payload: true
  example_payload:
    provider: "gmail"
    message_id: "example-id"
    thread_id: "example-thread"
    from_address:
      address: "someone@example.com"
      name: "Someone"
    to:
      - address: "qspencer@gmail.com"
    cc: []
    bcc: []
    subject: "Example subject"
    body_text: "Example body."
    body_html: null
    received_at: "2026-07-11T09:00:00+00:00"
    labels: ["INBOX"]
    in_reply_to: null
    headers: {}

steps:
  # The codified-sender route (G13: a precheck that sent rule-covered
  # senders to an attention-only classifier) was RETIRED 2026-09-28. It had
  # been inert since 08-13, its evidence is withheld at rest under
  # TRACE_SAFE_ONLY, and it cost ~32% more per message than this
  # classifier. See docs/EMAIL_TRIAGE_CODIFY_PLAN.md.
  - id: triage
    label: "Classify the email (no tools)"
    type: agentic
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    # The content-reading step keeps the read-only fence — test-pinned.
    tools: []
    capabilities:
      tools: []
    goal: |
      You are triaging an inbound email — CLASSIFICATION ONLY. You have no
      tools: never attempt to reply or label; a separate step acts on your
      verdict. The trigger payload contains the full message: from_address,
      to, cc, subject, body_text, received_at, labels — plus, when the
      body is image-only (empty body_text), a `body_structure` summary of
      the HTML (link domains, image count, alt texts) derived safely
      without fetching anything.

      Apply the rubric in your memory (above this prompt): choose exactly
      one `category` from the five-bucket catalog AND a (usually empty)
      `attention` list per the attention-axis section.

      Then respond with ONLY a JSON object on one line — no prose, no
      markdown fences:
        {"category": "<one of five>", "attention": [<zero or more of
         "urgent"|"awaiting-reply"|"review">], "category_confidence":
         <0..1>, "summary": "<one short sentence — why>"}

    policy:
      max_iterations: 2
      max_total_tokens: 8000

  - id: record
    label: "Record the triage result"
    type: deterministic
    function: record_email_triage
    output_renderer: triage
    config:
      triage_from: steps.triage.output_text

  - id: apply
    label: "Apply the wf/<category> label"
    type: agentic
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    tools:
      - "email_label_apply__qspencer_gmail_com"
    capabilities:
      tools:
        - "email_label_apply__qspencer_gmail_com"
    # Input minimization (ACT_PLAN §3 / TWO_AXIS §4): this tool-holding
    # step sees ONLY an enum-derived, pre-validated label list and the
    # platform-supplied message id — never subject, body, sender, category
    # text, or any other attacker-influenced content.
    inputs:
      - steps.record.apply_labels
      - trigger.message_id
    # Tool-parameter pinning (external review finding 2): the engine forces
    # both tool params from context — the agent cannot label a different
    # message or apply a label outside the validated list even if steered.
    # An override attempt audits `tool_param_override_blocked`.
    pin_params:
      message_id: trigger.message_id
      labels: steps.record.apply_labels
    # Postcondition (external review finding 3): the step FAILS if it
    # finishes without a successful email_label_apply call — a silent tool
    # error followed by a prose "done" must not pass as success.
    require_tool_call:
      name: email_label_apply__qspencer_gmail_com
      min_success: 1
    goal: |
      Apply the given Gmail labels to one message, then stop.

      The context gives you `steps.record.apply_labels` (a pre-validated
      list of label names) and `trigger.message_id`. Call the
      email_label_apply tool ONCE with that message_id and exactly that
      label list. Do not add, remove, or rename any label. Do not call
      the tool more than once. After the tool returns, respond with one
      line stating the labels applied.
    policy:
      max_iterations: 2
      max_total_tokens: 2000
    runtime:
      retries: 2

edges:
  - from: triage
    to: record
  - from: record
    to: apply
    # Only enum-valid labels are acted on (TWO_AXIS §4, independent axes):
    # an empty apply_labels (unparseable / fully out-of-vocabulary verdict)
    # never reaches the tool-holding step; a valid attention flag applies
    # even when the category was malformed, and vice versa.
    condition: steps.record.apply_label_count > 0

policies:
  # Raised 14000→24000 (2026-07-27): full-coverage mail is longer than the
  # INBOX residue the original budget was calibrated on — 12 runs paused
  # on budget in the first widened-scope day. Body cap above bounds the
  # common case; this bounds the tail.
  max_total_tokens: 24000
  budget_action: pause

# G12 C1 — SHADOW ONLY (docs/ASK_THE_USER_PLAN.md). Nobody is asked
# anything: the engine runs the real scheduling rules (validation,
# duplicate suppression, the recipient cap, atomic creation) against
# shadow tables and audits what it WOULD have asked. Enabling real
# questions is C2 and needs the subject binding (§1b), which does not
# exist yet — `subject`/`recipient` are literals here for that reason.
questions:
  # The candidate comes from its OWN small call after the run, not from the
  # classifier: question text in the classifier's prompt measurably moved
  # labels twice (2026-09-20, 2026-10-04). See elicitation/suggest.py.
  suggest:
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    # Input minimization: sender, subject and the head of the body.
    inputs: [trigger.from_address, trigger.subject, trigger.body_text]
    max_input_chars: 1500
    max_output_tokens: 200
  subject: qspencer@gmail.com
  recipient: qspencer@gmail.com
  catalog:
    # Explicit, configurable experiment limits, reported with every
    # result in the audit entry (§8). They are the experiment's
    # parameters, not validated product choices.
    max_outstanding_per_recipient: 2
    pending_expiry_hours: 72
    topics:
      - id: employment_status
        revision: 1
        # The wording the owner would see. No {trigger.*}/{steps.*}
        # placeholder is permitted here — refused at load (§2a).
        prompt: "Are you currently looking for work?"
        answers: [seeking, employed, unknown]
        # The assertion the owner would confirm — not the bare token.
        fact:
          seeking: "The owner is currently looking for work."
          employed: "The owner is not currently looking for work."
          unknown: "The owner's employment status is unknown."
        # §6b: a changeable topic expires, so an unnoticed stale badge
        # cannot license indefinite use.
        valid_for_days: 90
        review_after_days: 60
        cue: "mail naming roles the owner could take, including job alerts and digests"
      # Added 2026-10-04 (operator's request): a second topic, so C1 also
      # exercises choosing BETWEEN topics and a second ask/expire cycle
      # (employment_status is spent — asked once, ever). Travel mail flips
      # from noise to relevant on this answer.
      - id: travel_plans
        revision: 1
        prompt: "Are you planning a trip in the next few months?"
        answers: [planning, not_planning, unknown]
        fact:
          planning: "The owner is planning a trip in the next few months."
          not_planning: "The owner is not planning a trip in the next few months."
          unknown: "The owner's travel plans are unknown."
        # Travel plans change faster than employment does.
        valid_for_days: 60
        review_after_days: 30
        cue: "trips, stays, tours and travel deals the owner could book"

learned_memory:
  user_id: qspencer@gmail.com
  # The ingress this content arrives through (the mailbox, not the sender).
  # veracium >=0.23.0 refuses third-party writes without a source id —
  # no source identity means revocation can never reach the record.
  source_id: gmail:qspencer@gmail.com
  recall:
    query_from: trigger.from_address.address
    token_budget: 600
    # Only facts distilled from the mail itself — never from our own past
    # verdicts, which veracium keeps rendering as history even once
    # disputed (2026-10-04, the Caraway → spam loop).
    filters:
      author_of_evidence: third_party
  observations:
    - text: |
        Received email from {trigger.from_address.name} <{trigger.from_address.address}>
        Subject: {trigger.subject}

        {trigger.body_text}
      author: third_party
      event_type: email
      date_from: trigger.received_at
      ref_from: trigger.message_id
    # The classifier's VERDICT is no longer observed (2026-10-04): recall
    # injected the agent's own past opinions back as facts about the sender,
    # so one early mistake re-confirmed itself (Caraway: every email → spam).
    # Only the email itself is remembered. tools/dispute_verdict_facts.py
    # retired what the old observation left behind.