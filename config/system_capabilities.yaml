# System capability layer — the OUTERMOST bound on every workflow (G30).
#
# Layers intersect, most restrictive wins: a workflow or step can only narrow
# what is allowed here, never widen it. Before 2026-10-29 production ran with
# no system layer at all, so a definition — including one drafted by the
# scaffold model — could declare itself unrestricted.
#
# Derived from what production actually uses, not from what it might: of 27
# definitions, three ran in the 30 days before this was set, and in
# capability-governed terms all three together use ONE tool. Everything else is
# an operator decision: to let a workflow use another tool or path, add it HERE,
# in a reviewed commit. That is the approval a scaffolded draft cannot give itself.
#
# Every attribute is stated explicitly. The loader refuses a missing or unknown
# key, because an omitted attribute means UNRESTRICTED — a typo would otherwise
# fail open. `null` means "this layer does not restrict it" and must be written.
#
# Deterministic file functions consult this too, as of G30 phase 2 — before
# that they wrote wherever their config said. Triggers still do their own I/O
# from operator config (a scaffolded draft's trigger is never registered).
#
# File patterns must be absolute and contain no '..'; `*` matches one path
# segment and `**` any depth. A path with a '..' segment is refused outright.

tools:
  - email_label_apply__qspencer_gmail_com

# Exactly the paths the live deterministic steps touch, and nothing else.
file_read:
  # dmarc-ingest / extract_reports — the trigger spools one folder per message
  - /home/ubuntu/.local/share/workflow-platform/dmarc/spool/*/*
  # dmarc-ingest / deliver_reports — reads what extract_reports wrote
  - /home/ubuntu/.local/share/workflow-platform/dmarc/extracted/*
  # scheduled-health-report / append — appending reads the log it appends to
  - /home/ubuntu/.local/share/workflow-platform/health/scheduled-health-report.log
file_write:
  # dmarc-ingest / extract_reports
  - /home/ubuntu/.local/share/workflow-platform/dmarc/extracted/*
  # dmarc-ingest / deliver_reports — the viewer watches this directory
  - /home/ubuntu/Dev/dmarc-viewer/xml-files/*
  # scheduled-health-report / append
  - /home/ubuntu/.local/share/workflow-platform/health/scheduled-health-report.log

# Enforced in the browser connector, the only surface where an agent chooses a
# network destination. No live workflow uses the browser. Deny-all.
allowed_hosts: []

# Per-call OUTPUT ceiling. Live agents' largest single call over ~7,000 calls
# was 147 tokens; 4096 is ~28x that, and bounds a runaway or a draft.
max_tokens_per_call: 4096
